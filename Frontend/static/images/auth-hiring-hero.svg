  <rect x="104" y="124" width="80" height="8" rx="4" fill="#f5be42" opacity="0.9"/>
  <rect x="104" y="142" width="188" height="6" rx="3" fill="#64748b"/>
  <rect x="104" y="156" width="160" height="6" rx="3" fill="#475569"/>
  <rect x="104" y="176" width="72" height="44" rx="8" fill="#1e293b" stroke="#f5be42" stroke-opacity="0.4"/>
